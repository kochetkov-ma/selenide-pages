name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Unused version to upload for Central Portal validation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: central-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release source and version
        id: version
        env:
          STAGING_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            git merge-base --is-ancestor HEAD origin/main
            version="${GITHUB_REF_NAME#v}"
            source_version="$(sed -n 's/^version=//p' gradle.properties)"
            if [[ "$version" != "$source_version" ]]; then
              echo "Tag version $version differs from gradle.properties version $source_version" >&2
              exit 1
            fi
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            [[ "$STAGING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
            if [[ "$STAGING_VERSION" == *-SNAPSHOT ]]; then
              echo 'Snapshot versions publish directly; use a release candidate for private staging' >&2
              exit 1
            fi
            version="$STAGING_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test all modules
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew clean build --no-daemon "-Pversion=$RELEASE_VERSION"
      - name: Verify signed local publication
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :selenide-pages-core:publishToMavenLocal :selenide-pages-core:signMavenPublication --no-daemon "-Pversion=$RELEASE_VERSION"
          python3 .github/scripts/verify-publication.py "$RELEASE_VERSION"
      - name: Upload deployment for Central Portal validation
        if: github.event_name == 'workflow_dispatch'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew :selenide-pages-core:publishToMavenCentral --no-daemon "-Pversion=$RELEASE_VERSION"
      - name: Publish to Maven Central
        if: github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew :selenide-pages-core:publishAndReleaseToMavenCentral --no-daemon "-Pversion=$RELEASE_VERSION" -PmavenCentralDeploymentValidation=PUBLISHED -PSONATYPE_CLOSE_TIMEOUT_SECONDS=3600
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-jars
          path: selenide-pages-core/build/libs/*.jar
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release-jars
      - name: Wait for public Maven Central artifacts
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          base="https://repo.maven.apache.org/maven2/org/brewcode/selenide-pages-core/$RELEASE_VERSION/selenide-pages-core-$RELEASE_VERSION"
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            pom=$(curl --connect-timeout 5 --max-time 10 --location --silent --output /dev/null --write-out '%{http_code}' "$base.pom" || true)
            jar=$(curl --connect-timeout 5 --max-time 10 --location --silent --output /dev/null --write-out '%{http_code}' "$base.jar" || true)
            if [[ "$pom" == 200 && "$jar" == 200 ]]; then
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            echo "Waiting for Maven Central artifacts ($remaining seconds left)"
            if (( remaining > 30 )); then
              sleep 30
            elif (( remaining > 0 )); then
              sleep "$remaining"
            fi
          done
          echo 'Maven Central artifacts did not become public within 30 minutes' >&2
          exit 1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-jars/*.jar --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
