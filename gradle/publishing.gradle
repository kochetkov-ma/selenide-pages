apply plugin: 'com.vanniktech.maven.publish'

mavenPublishing {
    publishToMavenCentral(false)
    signAllPublications()

    coordinates(project.group.toString(), project.name, project.version.toString())

    pom {
        name = project.ext.name
        description = project.ext.description
        url = 'https://github.com/kochetkov-ma/selenide-pages'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'kochetkov-ma'
                name = 'Maksim Kochetkov'
                email = 'apmatypa88@gmail.com'
                url = 'https://github.com/kochetkov-ma'
            }
        }
        scm {
            url = 'https://github.com/kochetkov-ma/selenide-pages'
            connection = 'scm:git:https://github.com/kochetkov-ma/selenide-pages.git'
            developerConnection = 'scm:git:ssh://git@github.com/kochetkov-ma/selenide-pages.git'
        }
    }
}

signing {
    required = {
        gradle.taskGraph.allTasks.any {
            it.project == project && it instanceof org.gradle.api.publish.maven.tasks.PublishToMavenRepository
        }
    }
}
